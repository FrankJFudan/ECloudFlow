defaults:
  - model: tiny
  - sample: balanced
  - data: pdbbind
  - loss: default
  - _self_

seed: 2026

trainer:
  accelerator: auto
  strategy: auto
  precision: 32-true
  devices: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  max_steps: 1000
  max_epochs: 100
  checkpoint_dir: outputs/checkpoints
  every_n_train_steps: 1000
  save_last: true
  resume_from: null
  init_from: null
  reproducible_resume: true
  deterministic: true
  benchmark: false
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  nan_failure_threshold: 1
  max_nan_artifacts: 3
  learning_rate: 1.0e-4
  weight_decay: 0.0
  ema_decay: 0.999
  interior_noise: 0.2
