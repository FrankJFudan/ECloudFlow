[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecloudflow"
version = "0.1.0"
description = "Pocket-conditioned SE(3)-equivariant 3D molecular generation with electron-cloud latents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "torch>=2.7,<2.8",
  "torch-geometric>=2.6,<2.7",
  "e3nn>=0.5.6,<0.7",
  "lightning>=2.5,<2.6",
  "hydra-core>=1.3,<1.4",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rdkit>=2024.9,<2026",
  "biopython>=1.83,<2",
  "webdataset>=0.2.100,<2",
  "lmdb>=1.5,<3",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "matplotlib>=3.9,<4",
]

[project.scripts]
ecloudflow = "ecloudflow.cli.main:app"

[project.optional-dependencies]
train = ["wandb>=0.17"]
eval = ["ortools>=9.10", "posebusters>=0.3", "pandas>=2.2", "pyarrow>=17", "openpyxl>=3.1"]
viz = ["py3Dmol>=2.4", "plotly>=5.24", "seaborn>=0.13", "jinja2>=3.1"]
dev = ["pytest>=8.2", "pytest-cov>=5", "hypothesis>=6.110", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: requires xTB/Vina", "server: requires multi-GPU NCCL"]

[tool.mypy]
disable_error_code = ["prop-decorator"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecloudflow = [
  "config/defaults/*.yaml",
  "config/defaults/**/*.yaml",
  "visualization/styles/*.mplstyle",
  "visualization/templates/*.j2",
]
