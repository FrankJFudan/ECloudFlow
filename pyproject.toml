[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecloudflow"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.7",
  "torch-geometric>=2.6",
  "e3nn>=0.5.6",
  "lightning>=2.5",
  "hydra-core>=1.3",
  "pydantic>=2.8",
  "typer>=0.12",
  "rdkit>=2024.9",
  "biopython>=1.83",
  "webdataset>=0.2.100",
  "numpy>=1.26,<3",
  "scipy>=1.12",
]

[project.scripts]
ecloudflow = "ecloudflow.cli.main:app"

[project.optional-dependencies]
train = ["wandb>=0.17"]
eval = ["ortools>=9.10", "posebusters>=0.3", "pandas>=2.2", "pyarrow>=17", "openpyxl>=3.1"]
viz = ["py3Dmol>=2.4", "plotly>=5.24", "matplotlib>=3.9", "seaborn>=0.13", "jinja2>=3.1"]
dev = ["pytest>=8.2", "pytest-cov>=5", "hypothesis>=6.110", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: requires xTB/Vina", "server: requires multi-GPU NCCL"]

[tool.mypy]
disable_error_code = ["prop-decorator"]

[tool.setuptools.packages.find]
where = ["src"]
